apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgresql
spec:
  serviceName: postgresql
  replicas: 1
  selector:
    matchLabels:
      app: postgresql
  template:
    metadata:
      labels:
        app: postgresql
    spec:
      containers:
      - name: postgresql
        image: registry.redhat.io/rhel9/postgresql-16
        ports:
        - containerPort: 5432
          name: db
        env:
        - name: POSTGRESQL_USER
          value: accounts
        - name: POSTGRESQL_PASSWORD
          value: accounts-pw
        - name: POSTGRESQL_DATABASE
          value: accounts
        readinessProbe:
          exec:
            command: ["/usr/libexec/check-container"]
        livenessProbe:
          exec:
            command: ["/usr/libexec/check-container", "--live"]
        volumeMounts:
        - name: pvc-postgresql
          mountPath: /var/lib/pgsql/data
      volumes:
      - name: pvc-postgresql
        persistentVolumeClaim:
          claimName: pvc-postgresql
